name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy

  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: Install the pinned Rustic binary (checksum verified)
        run: ./scripts/install-rustic.sh .tools
      - name: Unit and integration tests (real Rustic, Pushgateway, Prometheus, Mosquitto, S3 server)
        run: uv run pytest -v
        env:
          REQUIRE_INTEGRATION: "1"

  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is derived from the Git tags
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - name: Version from the Git tags
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(./scripts/version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${version}" != "${RELEASE_TAG#v}" ]; then
            echo "::error::release tag ${RELEASE_TAG} gives version ${version}; use a tag like 0.4.0"
            exit 1
          fi
      - name: End-to-end test of the built image
        run: ./tests/e2e/run.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Decide whether to publish the image
        id: publish
        # Pull requests from forks get a read-only token and no secrets, so they only build.
        # Dependabot pull requests are not given a write token either.
        run: |
          echo "publish=${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}" >> "$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ github.event.release.tag_name || 'release' }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Log in to GHCR
        if: steps.publish.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish for both supported architectures
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Describe the image in the job summary
        env:
          PUBLISHED: ${{ steps.publish.outputs.publish }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## Docker image"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Event: \`${EVENT}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            if [ "${PUBLISHED}" = "true" ]; then
              echo "- Image: \`${IMAGE}\`"
              echo "- Digest: \`${DIGEST}\`"
              echo "- Pull by digest: \`docker pull ${IMAGE}@${DIGEST}\`"
              echo
              echo "Tags:"
              echo
              while read -r tag; do
                echo "- \`${tag}\`"
              done <<< "${TAGS}"
            else
              echo
              echo "Not published: this is a fork or Dependabot pull request, so the image was built and tested only."
            fi
            echo
            echo "<details>"
            echo "<summary>Image labels</summary>"
            echo
            echo '```text'
            echo "${LABELS}"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
